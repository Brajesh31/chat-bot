name: Resolve Vite 8 peer compatibility (temporary)

on:
  push:
    branches:
      - dependabot/npm_and_yarn/vite-8.3.8
    paths:
      - package.json
      - .github/workflows/resolve-vite8-peer.yml

permissions:
  contents: write

jobs:
  resolve-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Regenerate lockfile for the compatible Vite and React plugin pair
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reproduce clean install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and repository tests
        run: npm test
      - name: Validate documentation
        run: npm run docs:check
      - name: Production build
        run: npm run build
      - name: Report dependency audit separately
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Commit verified lockfile and remove temporary workflow
        run: |
          git rm .github/workflows/resolve-vite8-peer.yml
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: align React plugin with Vite 8"
          git push origin "HEAD:${GITHUB_REF_NAME}"
