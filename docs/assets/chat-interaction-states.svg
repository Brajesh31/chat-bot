<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ChatBuddy interaction states</title>
  <desc id="desc">Four illustrative panels show the initial chat, a submitted prompt and scripted response, a cleared conversation, and a minimized chat header.</desc>
  <rect width="1200" height="520" rx="28" fill="#f4f0ff"/>
  <text x="54" y="58" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#2d2250">ChatBuddy interaction states</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(44 96)">
      <rect width="260" height="350" rx="20" fill="#fff" stroke="#cbbcf0" stroke-width="2"/>
      <rect width="260" height="58" rx="20" fill="#6d4fc2"/>
      <path d="M0 38h260v20H0z" fill="#6d4fc2"/>
      <text x="20" y="36" font-size="18" font-weight="700" fill="#fff">Initial</text>
      <circle cx="34" cy="106" r="15" fill="#6d4fc2"/>
      <rect x="60" y="90" width="160" height="60" rx="12" fill="#e5d9ff"/>
      <text x="74" y="115" font-size="13" fill="#30244e">Hey there!</text>
      <text x="74" y="134" font-size="13" fill="#30244e">How can I help?</text>
      <rect x="18" y="294" width="224" height="38" rx="19" fill="#faf9ff" stroke="#c9c3da"/>
      <text x="34" y="318" font-size="12" fill="#827b95">Message...</text>
    </g>
    <g transform="translate(336 96)">
      <rect width="260" height="350" rx="20" fill="#fff" stroke="#cbbcf0" stroke-width="2"/>
      <rect width="260" height="58" rx="20" fill="#6d4fc2"/>
      <path d="M0 38h260v20H0z" fill="#6d4fc2"/>
      <text x="20" y="36" font-size="18" font-weight="700" fill="#fff">Submitted</text>
      <rect x="98" y="84" width="142" height="42" rx="12" fill="#6d4fc2"/>
      <text x="116" y="110" font-size="13" fill="#fff">hello</text>
      <circle cx="34" cy="162" r="15" fill="#6d4fc2"/>
      <rect x="60" y="145" width="170" height="58" rx="12" fill="#e5d9ff"/>
      <text x="74" y="170" font-size="13" fill="#30244e">A local scripted</text>
      <text x="74" y="189" font-size="13" fill="#30244e">reply appears.</text>
      <rect x="18" y="294" width="224" height="38" rx="19" fill="#faf9ff" stroke="#c9c3da"/>
      <text x="34" y="318" font-size="12" fill="#827b95">Message...</text>
    </g>
    <g transform="translate(628 96)">
      <rect width="260" height="350" rx="20" fill="#fff" stroke="#cbbcf0" stroke-width="2"/>
      <rect width="260" height="58" rx="20" fill="#6d4fc2"/>
      <path d="M0 38h260v20H0z" fill="#6d4fc2"/>
      <text x="20" y="36" font-size="18" font-weight="700" fill="#fff">Cleared</text>
      <circle cx="34" cy="106" r="15" fill="#6d4fc2"/>
      <rect x="60" y="90" width="160" height="60" rx="12" fill="#e5d9ff"/>
      <text x="74" y="115" font-size="13" fill="#30244e">Initial greeting</text>
      <text x="74" y="134" font-size="13" fill="#30244e">remains visible.</text>
      <rect x="18" y="294" width="224" height="38" rx="19" fill="#faf9ff" stroke="#c9c3da"/>
      <text x="34" y="318" font-size="12" fill="#827b95">Message...</text>
    </g>
    <g transform="translate(920 96)">
      <rect width="236" height="350" rx="20" fill="#fff" stroke="#cbbcf0" stroke-width="2"/>
      <rect width="236" height="58" rx="20" fill="#6d4fc2"/>
      <path d="M0 38h236v20H0z" fill="#6d4fc2"/>
      <text x="18" y="36" font-size="18" font-weight="700" fill="#fff">Minimized</text>
      <rect x="18" y="90" width="200" height="92" rx="14" fill="#f6f2ff" stroke="#d8c9f2"/>
      <text x="34" y="126" font-size="14" fill="#30244e">Header stays visible.</text>
      <text x="34" y="150" font-size="13" fill="#665d7d">Message area hidden.</text>
      <text x="600" y="494" font-size="1" fill="#f4f0ff"> </text>
    </g>
  </g>
  <text x="54" y="486" font-family="Inter,Arial,sans-serif" font-size="14" fill="#665d7d">Illustrative wireframe, not a screenshot. Conversation state is held in browser memory only.</text>
</svg>