<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ChatBuddy interface preview</title><desc id="desc">A desktop browser-style preview of the ChatBuddy local chat demo, showing its purple header, clear and minimize controls, a welcome bubble, a visitor prompt, a scripted reply, a message input and a transparency note.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3efff"/><stop offset="1" stop-color="#d8caff"/></linearGradient><linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6046c7"/><stop offset="1" stop-color="#8063d7"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3b286d" flood-opacity=".18"/></filter><style>.h{font:700 26px Arial,sans-serif;fill:#fff}.sub{font:14px Arial,sans-serif;fill:#ede7ff}.text{font:17px Arial,sans-serif;fill:#29243d}.muted{font:14px Arial,sans-serif;fill:#736f86}.bubble{fill:#e8ddff}.user{fill:#6d4fc2}.userText{font:16px Arial,sans-serif;fill:#fff}.small{font:12px Arial,sans-serif;fill:#78738c}.btn{fill:#fff;opacity:.18}</style></defs><rect width="1200" height="760" fill="url(#bg)"/><circle cx="110" cy="124" r="110" fill="#fff" opacity=".25"/><circle cx="1090" cy="650" r="170" fill="#fff" opacity=".18"/><g filter="url(#shadow)"><rect x="310" y="52" width="580" height="660" rx="28" fill="#fff"/><path d="M338 52h524a28 28 0 0 1 28 28v82H310V80a28 28 0 0 1 28-28z" fill="url(#head)"/><circle cx="362" cy="108" r="25" fill="#fff"/><path d="M347 99q0-8 8-8h15q8 0 8 8v13q0 8-8 8h-8l-8 7v-7q-7-1-7-8z" fill="#6d4fc2"/><circle cx="357" cy="104" r="2.5" fill="#fff"/><circle cx="369" cy="104" r="2.5" fill="#fff"/><path d="M356 112q7 5 14 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="402" y="102" class="h">ChatBuddy</text><text x="402" y="126" class="sub">Local demo assistant</text><circle cx="810" cy="108" r="18" class="btn"/><path d="M801 100h18M801 108h18M801 116h18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="850" cy="108" r="18" class="btn"/><path d="M842 105l8 8 8-8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="354" cy="190" r="17" fill="#6d4fc2"/><path d="M344 184q0-5 5-5h10q5 0 5 5v7q0 5-5 5h-5l-5 4v-4q-5 0-5-5z" fill="#fff"/><rect x="382" y="164" width="300" height="78" rx="15" class="bubble"/><text x="404" y="194" class="text">Hey there 👋</text><text x="404" y="220" class="text">How can I help you today?</text><rect x="560" y="274" width="288" height="70" rx="15" class="user"/><text x="585" y="316" class="userText">What is AI?</text><circle cx="354" cy="395" r="17" fill="#6d4fc2"/><path d="M344 389q0-5 5-5h10q5 0 5 5v7q0 5-5 5h-5l-5 4v-4q-5 0-5-5z" fill="#fff"/><rect x="382" y="366" width="420" height="104" rx="15" class="bubble"/><text x="404" y="398" class="text">AI means Artificial Intelligence.</text><text x="404" y="425" class="text">This demo uses scripted rules,</text><text x="404" y="452" class="text">not an AI model. 🤖</text><rect x="340" y="594" width="520" height="54" rx="27" fill="#fff" stroke="#d1cde0" stroke-width="2"/><text x="372" y="628" class="muted">Message...</text><circle cx="824" cy="621" r="19" fill="#6d4fc2"/><path d="M824 611v20m-8-8 8 8 8-8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="670" text-anchor="middle" class="small">Local scripted replies. Messages are not sent to an AI service.</text></g><text x="600" y="735" text-anchor="middle" class="muted">Illustrative interface preview, not a browser screenshot</text></svg>