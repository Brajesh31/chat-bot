<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Chat Bot local message flow</title><desc id="desc">Visitor input flows to React form, local phrase matcher, in-memory state, and rendered bubbles.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#6046c7"/><stop offset="1" stop-color="#9b7bed"/></linearGradient><style>.t{font:600 22px Arial,sans-serif;fill:#202033}.s{font:16px Arial,sans-serif;fill:#51516a}.n{fill:#fff;stroke:#8065d7;stroke-width:2}.a{stroke:#7155cb;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1200" height="420" rx="26" fill="#f6f3ff"/><text x="56" y="58" class="t" font-size="28">Current browser-only architecture</text><g transform="translate(40 135)"><rect class="n" width="190" height="150" rx="18"/><circle cx="95" cy="48" r="22" fill="url(#g)"/><path d="M86 48h18M95 39v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="95" y="98" text-anchor="middle" class="t">Visitor</text><text x="95" y="124" text-anchor="middle" class="s">Types prompt</text></g><path class="a" d="M235 210h60m-12-12 12 12-12 12"/><g transform="translate(305 135)"><rect class="n" width="190" height="150" rx="18"/><rect x="63" y="28" width="64" height="46" rx="9" fill="url(#g)"/><path d="M77 43h36M77 55h26" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="95" y="98" text-anchor="middle" class="t">React Form</text><text x="95" y="124" text-anchor="middle" class="s">Trim + submit</text></g><path class="a" d="M500 210h60m-12-12 12 12-12 12"/><g transform="translate(570 135)"><rect class="n" width="190" height="150" rx="18"/><circle cx="95" cy="50" r="25" fill="url(#g)"/><path d="M83 51q12 14 24 0" stroke="#fff" stroke-width="3" fill="none"/><text x="95" y="98" text-anchor="middle" class="t">Local rules</text><text x="95" y="124" text-anchor="middle" class="s">Canned reply</text></g><path class="a" d="M765 210h60m-12-12 12 12-12 12"/><g transform="translate(835 135)"><rect class="n" width="150" height="150" rx="18"/><path d="M45 40h60v35H45zM57 86h60v24H57z" fill="url(#g)"/><text x="75" y="130" text-anchor="middle" class="t">State</text></g><path class="a" d="M990 210h55m-12-12 12 12-12 12"/><g transform="translate(1055 135)"><rect class="n" width="110" height="150" rx="18"/><path d="M20 43h65M20 66h48M37 91h56" stroke="#8065d7" stroke-width="12" stroke-linecap="round"/><text x="55" y="130" text-anchor="middle" class="t">UI</text></g><text x="600" y="360" text-anchor="middle" class="s">No model API · No app server · No database · Refresh clears conversation</text></svg>