<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Local response selection flow</title><desc id="desc">Prompt is normalized to lowercase, checked against ordered phrase conditions, then a canned or fallback answer is selected.</desc><defs><style>.box{fill:#fff;stroke:#7255c8;stroke-width:2}.t{font:600 21px Arial;fill:#25213a}.s{font:16px Arial;fill:#625d77}.line{fill:none;stroke:#7255c8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1000" height="360" rx="24" fill="#f6f3ff"/><g><rect class="box" x="35" y="120" width="180" height="110" rx="16"/><text class="t" x="125" y="164" text-anchor="middle">Prompt</text><text class="s" x="125" y="194" text-anchor="middle">User text</text><path class="line" d="M220 175h60l-12-12m12 12-12 12"/><rect class="box" x="285" y="120" width="180" height="110" rx="16"/><text class="t" x="375" y="164" text-anchor="middle">Normalize</text><text class="s" x="375" y="194" text-anchor="middle">Lowercase text</text><path class="line" d="M470 175h60l-12-12m12 12-12 12"/><rect class="box" x="535" y="120" width="180" height="110" rx="16"/><text class="t" x="625" y="164" text-anchor="middle">Ordered rules</text><text class="s" x="625" y="194" text-anchor="middle">First match wins</text><path class="line" d="M720 175h60l-12-12m12 12-12 12"/><rect class="box" x="785" y="72" width="180" height="86" rx="16"/><text class="t" x="875" y="108" text-anchor="middle">Canned reply</text><text class="s" x="875" y="134" text-anchor="middle">Matched rule</text><rect class="box" x="785" y="208" width="180" height="86" rx="16"/><text class="t" x="875" y="244" text-anchor="middle">Fallback</text><text class="s" x="875" y="270" text-anchor="middle">No rule matched</text><path class="line" d="M625 120V115h145"/><path class="line" d="M625 230v21h145"/><text class="s" x="500" y="330" text-anchor="middle">No model inference or remote knowledge lookup occurs</text></g></svg>