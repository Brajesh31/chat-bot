<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ChatBuddy GitHub social preview</title>
  <desc id="desc">A 1280 by 640 purple and lavender promotional illustration for ChatBuddy, a React chat interface learning demo with local scripted responses. A decorative chat card appears on the right. This is artwork, not a screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21183e"/>
      <stop offset="1" stop-color="#6d4fc2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eee7ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <circle cx="1160" cy="90" r="230" fill="#bda8ff" opacity=".13"/>
  <circle cx="100" cy="610" r="200" fill="#bda8ff" opacity=".10"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="88" y="88" width="88" height="88" rx="26" fill="#ffffff"/>
    <path d="M111 110h42a10 10 0 0 1 10 10v22a10 10 0 0 1-10 10h-17l-16 12v-12h-9a10 10 0 0 1-10-10v-22a10 10 0 0 1 10-10Z" fill="#6d4fc2"/>
    <circle cx="124" cy="132" r="4" fill="#fff"/>
    <circle cx="137" cy="132" r="4" fill="#fff"/>
    <circle cx="150" cy="132" r="4" fill="#fff"/>
    <text x="88" y="260" fill="#ffffff" font-size="62" font-weight="800">ChatBuddy</text>
    <text x="92" y="322" fill="#e8ddff" font-size="30" font-weight="600">A chat interface built for learning.</text>
    <text x="92" y="386" fill="#ffffff" opacity=".92" font-size="22">React 18  ·  Vite 6  ·  JavaScript</text>
    <rect x="92" y="438" width="570" height="54" rx="27" fill="#ffffff" opacity=".13"/>
    <text x="120" y="473" fill="#ffffff" font-size="19" font-weight="600">LOCAL SCRIPTED REPLIES  •  NO BACKEND  •  NO LLM</text>
    <text x="92" y="570" fill="#d7c9ff" font-size="16">Educational frontend project · Illustrative graphic, not a live screenshot</text>
    <g transform="translate(760 92)">
      <rect x="0" y="0" width="420" height="456" rx="30" fill="url(#card)" stroke="#d8cafd" stroke-width="3"/>
      <rect x="0" y="0" width="420" height="92" rx="30" fill="#6d4fc2"/>
      <path d="M0 55h420v37H0z" fill="#6d4fc2"/>
      <text x="34" y="58" font-size="28" font-weight="750" fill="#ffffff">ChatBuddy</text>
      <text x="35" y="126" font-size="15" fill="#756b8e">Local demo assistant</text>
      <rect x="176" y="154" width="210" height="66" rx="18" fill="#6d4fc2"/>
      <text x="204" y="195" font-size="19" fill="#ffffff">Hello, ChatBuddy!</text>
      <rect x="34" y="246" width="300" height="88" rx="18" fill="#e5d9ff"/>
      <text x="58" y="282" font-size="18" fill="#30244e">Hey there! 😊</text>
      <text x="58" y="310" font-size="16" fill="#51486b">A scripted reply appears here.</text>
      <rect x="32" y="368" width="356" height="54" rx="27" fill="#ffffff" stroke="#cfc2ec" stroke-width="2"/>
      <text x="60" y="402" font-size="17" fill="#9b92aa">Message...</text>
      <circle cx="354" cy="395" r="20" fill="#6d4fc2"/>
      <path d="M354 406v-22m-9 9 9-9 9 9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>